<title>kimanhiudau 💗</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#02030d;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1;transform:scale(2)}}
nav{position:fixed;z-index:20;top:0;left:0;right:0;text-align:center;padding:16px;background:#030516aa;backdrop-filter:blur(9px)}
nav a{color:#fff;text-decoration:none;font-weight:bold;margin:0 13px;text-shadow:0 0 12px #ff5acb}
.hero{min-height:100vh;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:85px 18px 40px;background:radial-gradient(circle at 50% 35%,#39255d55
